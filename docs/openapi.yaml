
openapi: 3.0.0

info:
  title: Simple POS API
  version: 1.0.0

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/logout:
    post:
      summary: Logout dan mencabut token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout berhasil
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Nomor halaman yang ingin ditampilkan.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Jumlah produk per halaman, minimal 1 dan maksimal 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: integer
                        category:
                          type: string
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/categories:
    get:
      summary: Ambil daftar kategori
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar kategori berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - product_id
                      - qty
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
                        minimum: 1
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      total:
                        type: integer
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
